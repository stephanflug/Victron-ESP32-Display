name: Build ESP32 Firmware

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Arduino CLI installieren
        uses: arduino/setup-arduino-cli@v2

      - name: ESP32 Core installieren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0

      - name: Bibliotheken installieren
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ArduinoJson"

      - name: Firmware kompilieren
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --output-dir build \
            firmware/V4.2.0

      - name: Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Victron-ESP32-Display-Firmware
          path: build/*.bin
